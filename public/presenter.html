<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Präsentator · mirrordeck</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  #main { height: 100vh; }
  aside {
    display: flex; flex-direction: column; gap: 14px; padding: 16px;
    background: var(--panel); border-left: 1px solid var(--line); overflow: auto;
  }
  h1 { font-size: 16px; margin: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
  #preview { aspect-ratio: 16 / 9; border-radius: 6px; border: 1px solid var(--line); }
  #previewNote { font-size: 13px; }
  #thumbs {
    position: relative; display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity;
    padding: 4px 2px 8px; scrollbar-width: thin;
  }
  .thumb { flex: 0 0 132px; scroll-snap-align: center; cursor: pointer; text-align: center; font-size: 12px; color: var(--muted); }
  .thumb .frame { aspect-ratio: 16 / 9; border-radius: 4px; outline: 2px solid var(--line); margin-bottom: 4px; }
  .thumb:hover .frame { outline-color: var(--muted); }
  .thumb.current .frame { outline: 3px solid var(--accent); }
  .thumb.current { color: var(--accent); font-weight: 700; }
  button.mini { font-size: 11px; padding: 3px 8px; text-transform: none; letter-spacing: 0; color: var(--text); }
  #overview {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: flex; flex-direction: column; padding: 20px 28px;
  }
  #overview[hidden] { display: none; }
  #overview header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #overviewGrid {
    flex: 1; overflow: auto; display: grid; gap: 18px; align-content: start; padding: 4px;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  #overviewGrid .thumb { font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .nav button { flex: 1; font-size: 18px; }
  #counter { font-size: 28px; font-variant-numeric: tabular-nums; }
  #link { width: 100%; font-size: 13px; }
  #error { color: #f66; display: none; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; }
  body.focus { grid-template-columns: 1fr 0; }
  body.focus aside { display: none; }
</style>
</head>
<body>
<div id="main" class="frame"></div>
<aside>
  <h1 id="title">…</h1>
  <div id="error"></div>
  <div class="row">
    <span class="pill"><span id="dot" class="dot"></span><span id="status">verbinde…</span></span>
    <span class="pill">👥 <span id="viewers">0</span></span>
    <span class="pill" id="modePill" title="Erkannter Sync-Modus">…</span>
  </div>

  <section>
    <h2>Aktuell</h2>
    <div id="counter">–</div>
  </section>

  <div class="row nav">
    <button id="prevBtn" title="Zurück (←)">←</button>
    <button id="nextBtn" class="primary" title="Weiter (→ / Leertaste)">→</button>
  </div>

  <section>
    <h2>Nächste Folie</h2>
    <div id="preview" class="frame"></div>
    <div id="previewNote" class="muted" hidden>Vorschau nur bei Präsentationen im mirrordeck-Format verfügbar.</div>
  </section>

  <section id="thumbsSection" hidden>
    <h2 style="display:flex;justify-content:space-between;align-items:center">Alle Folien
      <button id="overviewBtn" class="mini" title="Übersicht aller Folien (G)">▦ Übersicht</button></h2>
    <div id="thumbs"></div>
  </section>

  <section>
    <h2>Zuschauer-Link</h2>
    <input id="link" readonly>
    <div class="row" style="margin-top:8px">
      <button id="copyBtn">Kopieren</button>
      <a id="openLink" target="_blank" rel="noopener">öffnen</a>
    </div>
  </section>

  <section>
    <h2>Zeigen</h2>
    <div class="row">
      <button id="pointerBtn" title="Laserpointer an/aus (L)">🔴 Laserpointer</button>
      <label class="muted" style="font-size:13px"><input type="checkbox" id="mirrorChk"> Hover &amp; Klicks spiegeln</label>
    </div>
  </section>

  <section>
    <h2>Ansicht</h2>
    <div class="row">
      <button id="fitBtn"></button>
      <button id="focusBtn" title="Seitenleiste aus/ein (S)">Seitenleiste</button>
      <button id="fsBtn" title="Vollbild (F)">Vollbild</button>
    </div>
  </section>

  <p class="muted" style="font-size:12px;margin-top:auto">
    <kbd>←</kbd> <kbd>→</kbd> <kbd>Leertaste</kbd> navigieren · <kbd>G</kbd> Übersicht · <kbd>L</kbd> Laserpointer · <kbd>S</kbd> Seitenleiste · <kbd>F</kbd> Vollbild
  </p>
</aside>

<div id="overview" hidden>
  <header>
    <strong>Alle Folien</strong>
    <button id="overviewClose" title="Schließen (Esc)">✕ Schließen</button>
  </header>
  <div id="overviewGrid"></div>
</div>

<script type="module">
  import { mountDeck, connect, deckId } from "/common.js";

  const id = deckId();
  const key = new URLSearchParams(location.search).get("key") || "";
  const $ = (s) => document.getElementById(s);
  const showError = (t) => { $("error").textContent = t; $("error").style.display = "block"; };

  const meta = await fetch(`/api/decks/${encodeURIComponent(id)}`).then((r) => (r.ok ? r.json() : null));
  if (!meta) { showError("Präsentation nicht gefunden."); throw new Error("not found"); }
  $("title").textContent = meta.title;
  document.title = `▶ ${meta.title} · mirrordeck`;

  const viewerUrl = `${location.origin}/v/${encodeURIComponent(id)}`;
  $("link").value = viewerUrl;
  $("openLink").href = viewerUrl;
  $("copyBtn").onclick = async () => {
    await navigator.clipboard.writeText(viewerUrl);
    $("copyBtn").textContent = "Kopiert ✓";
    setTimeout(() => ($("copyBtn").textContent = "Kopieren"), 1500);
  };

  // ---- state ----
  let mode = null;          // "deck" | "events"
  let mainReady = false;
  let previewReady = false;
  let current = null;       // last state from the main deck
  let serverInit = null;    // init payload from server (for restoring after reload)
  let restored = false;

  const renderCounter = () => {
    if (!current) return;
    if (current.kind === "deck") {
      const total = current.total ? ` / ${current.total}` : "";
      $("counter").textContent = `Folie ${current.slide + 1}${total}` + (current.step ? ` · Schritt ${current.step}` : "");
    } else {
      $("counter").textContent = current.hash || "—";
    }
  };

  const updatePreview = () => {
    if (mode !== "deck" || !previewReady || !current) return;
    preview.send({ type: "apply", state: current });
    preview.send({ type: "next" });
  };

  const restoreFromServer = () => {
    if (!mainReady || !serverInit) return;
    if (mode === "deck") {
      if (serverInit.state && serverInit.state.kind === "deck") main.send({ type: "apply", state: serverInit.state });
    } else {
      // Fallback mode cannot reproduce history reliably: start clean for everyone.
      sync.send({ type: "reset" });
    }
    serverInit = null;
    restored = true;
  };

  // ---- frames ----
  const main = mountDeck($("main"), {
    id,
    role: "presenter",
    interactive: true,
    onMessage(msg) {
      switch (msg.type) {
        case "ready":
          mode = msg.mode;
          mainReady = true;
          $("modePill").textContent = mode === "deck" ? "mirrordeck-Format" : "Fallback-Modus";
          $("preview").hidden = mode !== "deck";
          $("previewNote").hidden = mode === "deck";
          current = msg.state;
          renderCounter();
          restoreFromServer();
          updatePreview();
          if (mode === "deck" && msg.total) buildThumbs(msg.total);
          break;
        case "state":
          current = msg.state;
          sync.send({ type: "state", state: msg.state });
          renderCounter();
          updatePreview();
          highlightThumb();
          break;
        case "input":
          sync.send({ type: "input", input: msg.input });
          break;
        case "key":
          handleShortcut(msg.key);
          break;
        case "pointer":
          if (!pointerOn) break;
          gestureActive = true;
          sync.send({ type: "pointer", data: msg.data });
          main.send({ type: "pointer", data: msg.data });
          break;
        case "hover":
        case "click":
          if (!mirror) break;
          gestureActive = true;
          sync.send({ type: msg.type, data: msg.data });
          break;
      }
    },
  });

  const preview = mountDeck($("preview"), {
    id,
    role: "preview",
    interactive: false,
    onMessage(msg) {
      if (msg.type !== "ready") return;
      previewReady = true;
      updatePreview();
    },
  });

  // ---- laser pointer & gesture mirroring ----
  let pointerOn = false;
  const togglePointer = () => {
    pointerOn = !pointerOn;
    $("pointerBtn").classList.toggle("primary", pointerOn);
    if (!pointerOn) {
      sync.send({ type: "pointer", data: { hidden: true } });
      main.send({ type: "pointer", data: { hidden: true } });
    }
  };
  $("pointerBtn").onclick = togglePointer;

  // Mouse events reaching this page mean the pointer is outside the deck iframe: clear gestures once.
  let gestureActive = false;
  document.addEventListener("mousemove", () => {
    if (!gestureActive) return;
    gestureActive = false;
    sync.send({ type: "pointer", data: { hidden: true } });
    sync.send({ type: "hover", data: null });
    main.send({ type: "pointer", data: { hidden: true } });
  });

  let mirror = localStorage.getItem("mirrordeck:mirror") !== "off";
  $("mirrorChk").checked = mirror;
  $("mirrorChk").onchange = () => {
    mirror = $("mirrorChk").checked;
    localStorage.setItem("mirrordeck:mirror", mirror ? "on" : "off");
    if (!mirror) sync.send({ type: "hover", data: null });
  };

  // ---- slide thumbnails (carousel + overview grid) ----
  // Thumbnails are live deck iframes; only those near the visible area are mounted to keep CPU/memory low.
  function createThumbs(container, total, rootMargin, onPick) {
    const items = [];
    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        const t = items[Number(entry.target.dataset.slide)];
        if (entry.isIntersecting && !t.deck) {
          t.deck = mountDeck(t.frame, {
            id,
            role: "preview",
            interactive: false,
            onMessage(msg) {
              if (msg.type === "ready") t.deck.send({ type: "goto", slide: t.slide, step: Number.MAX_SAFE_INTEGER });
            },
          });
        } else if (!entry.isIntersecting && t.deck) {
          t.deck.destroy();
          t.deck = null;
        }
      }
    }, { root: container, rootMargin });

    for (let slide = 0; slide < total; slide++) {
      const el = document.createElement("div");
      el.className = "thumb";
      el.dataset.slide = String(slide);
      el.title = `Zu Folie ${slide + 1} springen`;
      const frame = document.createElement("div");
      frame.className = "frame";
      el.append(frame, String(slide + 1));
      el.onclick = () => {
        main.send({ type: "goto", slide, step: 0 });
        onPick?.();
      };
      container.append(el);
      items.push({ slide, el, frame, deck: null });
      observer.observe(el);
    }

    return {
      items,
      highlight(slide) {
        for (const t of items) t.el.classList.toggle("current", t.slide === slide);
        return items[slide]?.el;
      },
      destroy() {
        observer.disconnect();
        for (const t of items) t.deck?.destroy();
        container.replaceChildren();
      },
    };
  }

  let strip = null;
  function buildThumbs(total) {
    if (strip) return;
    const container = $("thumbs");
    strip = createThumbs(container, total, "0px 300px");
    container.addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      e.preventDefault();
      container.scrollLeft += e.deltaY;
    }, { passive: false });
    $("thumbsSection").hidden = false;
    highlightThumb(true);
  }

  let highlighted = -1;
  function highlightThumb(force = false) {
    if (!current || current.kind !== "deck" || (!force && current.slide === highlighted)) return;
    highlighted = current.slide;
    grid?.highlight(highlighted);
    const el = strip?.highlight(highlighted);
    if (!el) return;
    const container = $("thumbs");
    container.scrollTo({ left: el.offsetLeft - (container.clientWidth - el.offsetWidth) / 2, behavior: "smooth" });
  }

  // Overview grid: all slides at once, opened from the carousel header (G / Esc).
  let grid = null;
  function openOverview() {
    if (grid || !strip) return;
    $("overview").hidden = false;
    grid = createThumbs($("overviewGrid"), strip.items.length, "200px 0px", closeOverview);
    grid.highlight(highlighted)?.scrollIntoView({ block: "center" });
  }
  function closeOverview() {
    if (!grid) return;
    grid.destroy();
    grid = null;
    $("overview").hidden = true;
  }
  const toggleOverview = () => (grid ? closeOverview() : openOverview());
  $("overviewBtn").onclick = openOverview;
  $("overviewClose").onclick = closeOverview;

  // ---- fit toggle (presenter's own view) ----
  let fit = localStorage.getItem(`mirrordeck:pfit:${id}`) || meta.mode;
  const renderFit = () => {
    $("fitBtn").textContent = fit === "fit" ? "16:9" : "Vollfläche";
    main.setFit(fit);
  };
  $("fitBtn").onclick = () => {
    fit = fit === "fit" ? "fill" : "fit";
    localStorage.setItem(`mirrordeck:pfit:${id}`, fit);
    renderFit();
  };
  renderFit();

  // ---- navigation ----
  const next = () => main.send({ type: "next" });
  const prev = () => main.send({ type: "prev" });
  $("nextBtn").onclick = next;
  $("prevBtn").onclick = prev;
  const toggleFocus = () => document.body.classList.toggle("focus");
  const toggleFs = () =>
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  $("focusBtn").onclick = toggleFocus;
  $("fsBtn").onclick = toggleFs;

  // Shortcuts that work no matter whether the deck iframe or the page has focus.
  function handleShortcut(k) {
    if (k === "s" || k === "S") toggleFocus();
    else if (k === "f" || k === "F") toggleFs();
    else if (k === "l" || k === "L") togglePointer();
    else if (k === "g" || k === "G") toggleOverview();
    else if (k === "Escape") closeOverview();
  }

  document.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement || e.repeat) return;
    if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); prev(); }
    else handleShortcut(e.key);
  });
  // Buttons should not keep focus (space would re-trigger them).
  document.addEventListener("click", (e) => { if (e.target instanceof HTMLButtonElement) e.target.blur(); });

  // ---- server ----
  const sync = connect(id, key, {
    onStatus(on) {
      $("dot").classList.toggle("on", on);
      $("status").textContent = on ? "live" : "getrennt";
      if (on && current && mode === "deck") sync.send({ type: "state", state: current });
    },
    onFatal() {
      showError("Keine Verbindung – ist der Präsentator-Link (key) korrekt?");
    },
    onMessage(msg) {
      if (msg.type === "init") {
        if (msg.role !== "presenter") { showError("Ungültiger Präsentator-Schlüssel."); return; }
        if (restored) return; // reconnect: our live state is authoritative
        serverInit = msg;
        restoreFromServer();
      } else if (msg.type === "viewers") {
        $("viewers").textContent = msg.count;
      }
    },
  });
</script>
</body>
</html>
